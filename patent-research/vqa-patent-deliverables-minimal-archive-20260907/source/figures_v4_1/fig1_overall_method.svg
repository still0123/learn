<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1900" viewBox="0 0 1200 1900">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#000"/></marker>
    <style>
      text { font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 18px; fill: #000; }
      .small { font-size: 16px; }
      .box { fill: #fff; stroke: #000; stroke-width: 1.7; }
      .dash { fill: #fff; stroke: #000; stroke-width: 1.7; stroke-dasharray: 8 6; }
      .line { fill: none; stroke: #000; stroke-width: 1.7; marker-end: url(#arrow); }
      .plain { fill: none; stroke: #000; stroke-width: 1.7; }
      .dashed-line { fill: none; stroke: #000; stroke-width: 1.7; stroke-dasharray: 7 5; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="1900" fill="#fff"/><rect class="box" x="300" y="40" width="600" height="72" rx="3"/><text text-anchor="middle"><tspan x="600" y="82">101 获取视频与用户问题</tspan></text><rect class="box" x="300" y="150" width="600" height="72" rx="3"/><text text-anchor="middle"><tspan x="600" y="192">102 基于初始证据集 E0 生成初始答案 A0</tspan></text><rect class="box" x="300" y="260" width="600" height="72" rx="3"/><text text-anchor="middle"><tspan x="600" y="302">103 拆分 A0 原子声明并确定支持状态</tspan></text><polygon class="box" points="600,375 925,435 600,495 275,435"/><text text-anchor="middle"><tspan x="600" y="429.5">104 必填语义槽是否存在</tspan><tspan x="600" y="452.5">无声明或非支持状态？</tspan></text><rect class="box" x="300" y="540" width="600" height="72" rx="3"/><text text-anchor="middle"><tspan x="600" y="582">106 从 E0 未覆盖位置获取 ΔE</tspan></text><rect class="box" x="300" y="650" width="600" height="72" rx="3"/><text text-anchor="middle"><tspan x="600" y="692">107 冻结 E+ = E0 ∪ ΔE</tspan></text><rect class="box" x="300" y="760" width="600" height="72" rx="3"/><text text-anchor="middle"><tspan x="600" y="790">108 仅由问题与 E+ 生成 A2</tspan><tspan x="600" y="814">生成请求不含 A0 文本</tspan></text><rect class="box" x="300" y="870" width="600" height="72" rx="3"/><text text-anchor="middle"><tspan x="600" y="912">109 同一 E+、同一配置核验 A0 与 A2</tspan></text><rect class="box" x="300" y="980" width="600" height="72" rx="3"/><text text-anchor="middle"><tspan x="600" y="1010">110 建立声明迁移记录</tspan><tspan x="600" y="1034">事实槽—差异槽—见证ID—目标状态</tspan></text><rect class="box" x="300" y="1090" width="600" height="72" rx="3"/><text text-anchor="middle"><tspan x="600" y="1132">111 构建下游写入闭包与上游只读证明上下文</tspan></text><polygon class="box" points="600,1205 940,1265 600,1325 260,1265"/><text text-anchor="middle"><tspan x="600" y="1259.5">112 迁移、见证与闭包</tspan><tspan x="600" y="1282.5">一致性条件是否全部满足？</tspan></text><rect class="box" x="120" y="1370" width="400" height="82" rx="3"/><text text-anchor="middle"><tspan x="320" y="1417">113 原子提交闭包候选目标状态</tspan></text><rect class="box" x="680" y="1370" width="400" height="82" rx="3"/><text text-anchor="middle"><tspan x="880" y="1405">114 不写入候选状态并执行</tspan><tspan x="880" y="1429">E+ 下安全状态转移</tspan></text><rect class="box" x="300" y="1510" width="600" height="82" rx="3"/><text text-anchor="middle"><tspan x="600" y="1545">115 仅由已提交或保留状态重组</tspan><tspan x="600" y="1569">并执行无新增声明终检</tspan></text><rect class="box" x="300" y="1655" width="600" height="82" rx="3"/><text text-anchor="middle"><tspan x="600" y="1702">116 输出答案、结构化证据不足标识或拒答</tspan></text><path class="line" d="M600,112 L600,150"/><path class="line" d="M600,222 L600,260"/><path class="line" d="M600,332 L600,375"/><path class="line" d="M600,495 L600,540"/><text class="small" x="608" y="510.5">是</text><path class="line" d="M275,435 L80,435 L80,1551 L300,1551"/><text class="small" x="88" y="1544">否</text><path class="line" d="M600,612 L600,650"/><path class="line" d="M600,722 L600,760"/><path class="line" d="M600,832 L600,870"/><path class="line" d="M600,942 L600,980"/><path class="line" d="M600,1052 L600,1090"/><path class="line" d="M600,1162 L600,1205"/><path class="line" d="M400,1310 L320,1370"/><text class="small" x="328" y="1363">是</text><path class="line" d="M800,1310 L880,1370"/><text class="small" x="888" y="1363">否</text><path class="line" d="M320,1452 L320,1551 L300,1551"/><path class="line" d="M880,1452 L880,1551 L900,1551"/><path class="line" d="M600,1592 L600,1655"/></svg>