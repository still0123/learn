<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1200" viewBox="0 0 1500 1200">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#000"/></marker>
    <style>
      text { font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 18px; fill: #000; }
      .small { font-size: 16px; }
      .box { fill: #fff; stroke: #000; stroke-width: 1.7; }
      .dash { fill: #fff; stroke: #000; stroke-width: 1.7; stroke-dasharray: 8 6; }
      .line { fill: none; stroke: #000; stroke-width: 1.7; marker-end: url(#arrow); }
      .plain { fill: none; stroke: #000; stroke-width: 1.7; }
      .dashed-line { fill: none; stroke: #000; stroke-width: 1.7; stroke-dasharray: 7 5; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1500" height="1200" fill="#fff"/><rect class="box" x="520" y="45" width="460" height="80" rx="3"/><text text-anchor="middle"><tspan x="750" y="91">401 获取 A0 支持状态</tspan></text><polygon class="box" points="750,167.5 1050,230 750,292.5 450,230"/><text text-anchor="middle"><tspan x="750" y="224.5">402 是否存在必填槽</tspan><tspan x="750" y="247.5">无声明或非支持状态？</tspan></text><rect class="box" x="520" y="345" width="460" height="80" rx="3"/><text text-anchor="middle"><tspan x="750" y="391">403 获取 ΔE 并冻结 E+</tspan></text><rect class="box" x="520" y="475" width="460" height="95" rx="3"/><text text-anchor="middle"><tspan x="750" y="516.5">404 生成 A2 并在同一 E+ 下</tspan><tspan x="750" y="540.5">配对核验 A0/A2</tspan></text><rect class="box" x="520" y="620" width="460" height="95" rx="3"/><text text-anchor="middle"><tspan x="750" y="673.5">405 建立迁移记录及闭包</tspan></text><polygon class="box" points="750,767.5 1060,830 750,892.5 440,830"/><text text-anchor="middle"><tspan x="750" y="824.5">406 闭包接受条件</tspan><tspan x="750" y="847.5">是否全部满足？</tspan></text><rect class="box" x="80" y="970" width="380" height="88" rx="3"/><text text-anchor="middle"><tspan x="270" y="1020">407 原子提交闭包</tspan></text><rect class="box" x="560" y="970" width="380" height="88" rx="3"/><text text-anchor="middle"><tspan x="750" y="1020">408 执行 E+ 下安全状态转移</tspan></text><rect class="box" x="1040" y="970" width="380" height="88" rx="3"/><text text-anchor="middle"><tspan x="1230" y="1020">409 无补证时保留受支持 A0</tspan></text><rect class="box" x="500" y="1100" width="500" height="78" rx="3"/><text text-anchor="middle"><tspan x="750" y="1145">410 受限重组并输出或拒答</tspan></text><path class="line" d="M750,125 L750,168"/><path class="line" d="M750,293 L750,345"/><text class="small" x="758" y="312">是</text><path class="line" d="M750,425 L750,475"/><path class="line" d="M750,570 L750,620"/><path class="line" d="M750,715 L750,767"/><path class="line" d="M600,885 L270,970"/><text class="small" x="278" y="963">是</text><path class="line" d="M900,885 L750,970"/><text class="small" x="758" y="963">否</text><path class="line" d="M1050,230 L1230,230 L1230,970"/><text class="small" x="1238" y="223">否</text><path class="line" d="M270,1058 L270,1139 L500,1139"/><path class="line" d="M750,1058 L750,1100"/><path class="line" d="M1230,1058 L1230,1139 L1000,1139"/></svg>