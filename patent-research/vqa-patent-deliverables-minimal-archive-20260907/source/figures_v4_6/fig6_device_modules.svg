<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#000"/></marker>
    <style>
      text { font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 18px; fill: #000; }
      .small { font-size: 16px; }
      .tiny { font-size: 14px; }
      .box { fill: #fff; stroke: #000; stroke-width: 1.7; }
      .dash { fill: #fff; stroke: #000; stroke-width: 1.7; stroke-dasharray: 8 6; }
      .line { fill: none; stroke: #000; stroke-width: 1.7; marker-end: url(#arrow); }
      .plain { fill: none; stroke: #000; stroke-width: 1.7; }
      .dashed-line { fill: none; stroke: #000; stroke-width: 1.7; stroke-dasharray: 7 5; marker-end: url(#arrow); }
      .blocked-line { fill: none; stroke: #000; stroke-width: 1.7; stroke-dasharray: 7 5; }
    </style>
  </defs>
  <rect width="1500" height="1000" fill="#fff"/><rect class="box" x="455" y="35" width="590" height="76" rx="3"/><text class="" text-anchor="middle"><tspan x="750" y="67">601 初始状态生成单元</tspan><tspan x="750" y="91">获取视频、问题、E0并生成A0</tspan></text><rect class="box" x="455" y="145" width="590" height="76" rx="3"/><text class="" text-anchor="middle"><tspan x="750" y="177">602 增量证据获取单元</tspan><tspan x="750" y="201">取得E0未用ΔE并冻结E+</tspan></text><path class="line" d="M750,111 L750,145"/><rect class="box" x="455" y="255" width="590" height="76" rx="3"/><text class="" text-anchor="middle"><tspan x="750" y="287">603 证据许可单元</tspan><tspan x="750" y="311">在第一读取域形成并冻结证据差分许可</tspan></text><path class="line" d="M750,221 L750,255"/><rect class="box" x="455" y="365" width="590" height="76" rx="3"/><text class="" text-anchor="middle"><tspan x="750" y="397">604 隔离候选生成单元</tspan><tspan x="750" y="421">在第二读取域仅由问题与E+原始证据生成A2</tspan></text><path class="line" d="M750,331 L750,365"/><rect class="box" x="455" y="475" width="590" height="76" rx="3"/><text class="" text-anchor="middle"><tspan x="750" y="495">605 联合控制单元</tspan><tspan x="750" y="519">A2冻结后联合读取A0、A2与许可</tspan><tspan x="750" y="543">同E+形成实质事实迁移</tspan></text><path class="line" d="M750,441 L750,475"/><rect class="box" x="455" y="585" width="590" height="76" rx="3"/><text class="" text-anchor="middle"><tspan x="750" y="617">606 迁移配准子单元</tspan><tspan x="750" y="641">按槽、上下文、值、快照和ΔE见证逐项配准</tspan></text><path class="line" d="M750,551 L750,585"/><rect class="box" x="455" y="695" width="590" height="76" rx="3"/><text class="" text-anchor="middle"><tspan x="750" y="727">607 闭包控制单元</tspan><tspan x="750" y="751">闭包原子写入或禁止候选状态</tspan></text><path class="line" d="M750,661 L750,695"/><rect class="box" x="455" y="805" width="590" height="76" rx="3"/><text class="" text-anchor="middle"><tspan x="750" y="837">608 受限输出单元</tspan><tspan x="750" y="861">输出答案、不确定状态或拒答</tspan></text><path class="line" d="M750,771 L750,805"/><rect class="box" x="60" y="290" width="300" height="130" rx="3"/><text class="" text-anchor="middle"><tspan x="210" y="337">609 存储器</tspan><tspan x="210" y="361">证据快照、许可、A0/A2</tspan><tspan x="210" y="385">迁移、闭包及审计日志</tspan></text><rect class="box" x="1140" y="290" width="300" height="130" rx="3"/><text class="" text-anchor="middle"><tspan x="1290" y="349">610 处理器</tspan><tspan x="1290" y="373">执行各功能单元</tspan></text><rect class="box" x="65" y="600" width="360" height="145" rx="3"/><text class="" text-anchor="middle"><tspan x="245" y="654.5">611 访问控制与接口校验单元</tspan><tspan x="245" y="678.5">隔离第一读取域与第二读取域</tspan><tspan x="245" y="702.5">并校验候选生成输入</tspan></text><path class="line" d="M360,355 L455,355"/><text class="small" x="463" y="348">数据</text><path class="line" d="M1140,355 L1045,355"/><text class="small" x="1053" y="348">控制</text><path class="dashed-line" d="M425,650 L455,650"/><text class="small" x="463" y="643">权限控制</text><path class="dashed-line" d="M425,690 L440,690 L440,475 L455,475"/></svg>