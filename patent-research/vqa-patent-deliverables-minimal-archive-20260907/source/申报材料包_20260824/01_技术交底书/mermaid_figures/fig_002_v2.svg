<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1780" viewBox="0 0 1600 1780">
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#000"/></marker>
  <style>
    text { font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #000; }
    .box { fill: #fff; stroke: #000; stroke-width: 1.8; }
    .line { fill: none; stroke: #000; stroke-width: 1.8; marker-end: url(#arrow); }
  </style>
</defs>
<rect width="1600" height="1780" fill="#fff"/><rect class="box" x="520" y="35" width="600" height="72" rx="4"/><text text-anchor="middle" style="font-size:18px"><tspan x="820" y="77">S1 获取 V、Q 并形成 E0、A0</tspan></text><rect class="box" x="520" y="140" width="600" height="72" rx="4"/><text text-anchor="middle" style="font-size:18px"><tspan x="820" y="182">S2 由 Q 和任务规则确定事实槽模式</tspan></text><rect class="box" x="520" y="245" width="600" height="82" rx="4"/><text text-anchor="middle" style="font-size:18px"><tspan x="820" y="279.5">S3 取得相对 E0 未使用的 ΔE</tspan><tspan x="820" y="304.5">并冻结 E+</tspan></text><rect class="box" x="520" y="365" width="600" height="82" rx="4"/><text text-anchor="middle" style="font-size:18px"><tspan x="820" y="412">S4 第一读取域比较 E0/E+ 观测状态</tspan></text><polygon class="box" points="820,480 1180,545 820,610 460,545"/><text text-anchor="middle" style="font-size:18px"><tspan x="820" y="538.5">S5 是否存在由 ΔE 导致的</tspan><tspan x="820" y="563.5">实质证据差分</tspan></text><polygon class="box" points="265,662.5 480,720 265,777.5 50,720"/><text text-anchor="middle" style="font-size:18px"><tspan x="265" y="726">S6 是否仍有取证预算</tspan></text><rect class="box" x="65" y="875" width="400" height="90" rx="4"/><text text-anchor="middle" style="font-size:18px"><tspan x="265" y="913.5">S17 输出保留、不确定</tspan><tspan x="265" y="938.5">或拒答状态</tspan></text><rect class="box" x="850" y="675" width="620" height="82" rx="4"/><text text-anchor="middle" style="font-size:18px"><tspan x="1160" y="722">S7 生成许可、冻结摘要并记录 t_p</tspan></text><rect class="box" x="850" y="790" width="620" height="82" rx="4"/><text text-anchor="middle" style="font-size:18px"><tspan x="1160" y="837">S8 在 t_p 后独立生成 A2，记录 t_s</tspan></text><rect class="box" x="850" y="905" width="620" height="82" rx="4"/><text text-anchor="middle" style="font-size:18px"><tspan x="1160" y="952">S9 冻结 A2 摘要及版本，记录 t_a</tspan></text><rect class="box" x="850" y="1020" width="620" height="82" rx="4"/><text text-anchor="middle" style="font-size:18px"><tspan x="1160" y="1067">S10 在 t_a 后首次联合读取，记录 t_j</tspan></text><rect class="box" x="850" y="1135" width="620" height="82" rx="4"/><text text-anchor="middle" style="font-size:18px"><tspan x="1160" y="1182">S11 在同一 E+ 下规范化并核验 A0/A2</tspan></text><rect class="box" x="850" y="1250" width="620" height="82" rx="4"/><text text-anchor="middle" style="font-size:18px"><tspan x="1160" y="1297">S12 形成答案事实迁移并逐项唯一配准许可</tspan></text><rect class="box" x="850" y="1365" width="620" height="82" rx="4"/><text text-anchor="middle" style="font-size:18px"><tspan x="1160" y="1399.5">S13 构造下游状态写入闭包</tspan><tspan x="1160" y="1424.5">及上游证明引用集</tspan></text><polygon class="box" points="1160,1485 1500,1550 1160,1615 820,1550"/><text text-anchor="middle" style="font-size:18px"><tspan x="1160" y="1543.5">S14 闭包内全部迁移通过</tspan><tspan x="1160" y="1568.5">且不存在竞争事实</tspan></text><rect class="box" x="540" y="1670" width="480" height="82" rx="4"/><text text-anchor="middle" style="font-size:18px"><tspan x="780" y="1704.5">S15 原子写入、受限重组</tspan><tspan x="780" y="1729.5">及无新增事实终检</tspan></text><rect class="box" x="1100" y="1670" width="430" height="82" rx="4"/><text text-anchor="middle" style="font-size:18px"><tspan x="1315" y="1717">S16 整闭包禁写并进入安全状态机</tspan></text><path class="line" d="M820,107 L820,140"/><path class="line" d="M820,212 L820,245"/><path class="line" d="M820,327 L820,365"/><path class="line" d="M820,447 L820,480"/><path class="line" d="M460,545 L265,545 L265,662"/><text x="355" y="530" text-anchor="middle" style="font-size:16px">否</text><path class="line" d="M1180,545 L1210,545 L1210,655 L1160,655 L1160,675"/><text x="1198" y="530" text-anchor="middle" style="font-size:16px">是</text><path class="line" d="M265,778 L265,875"/><text x="280" y="830" text-anchor="middle" style="font-size:16px">无</text><path class="line" d="M50,720 L30,720 L30,286 L520,286"/><text x="42" y="700" text-anchor="start" style="font-size:16px">有</text><path class="line" d="M1160,757 L1160,790"/><path class="line" d="M1160,872 L1160,905"/><path class="line" d="M1160,987 L1160,1020"/><path class="line" d="M1160,1102 L1160,1135"/><path class="line" d="M1160,1217 L1160,1250"/><path class="line" d="M1160,1332 L1160,1365"/><path class="line" d="M1160,1447 L1160,1485"/><path class="line" d="M820,1550 L780,1550 L780,1670"/><text x="790" y="1535" text-anchor="middle" style="font-size:16px">是</text><path class="line" d="M1500,1550 L1540,1550 L1540,1650 L1315,1650 L1315,1670"/><text x="1518" y="1535" text-anchor="middle" style="font-size:16px">否</text></svg>