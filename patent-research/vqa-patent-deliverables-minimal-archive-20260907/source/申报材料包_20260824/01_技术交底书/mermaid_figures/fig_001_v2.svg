<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1240" viewBox="0 0 1600 1240">
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#000"/></marker>
  <style>
    text { font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 18px; fill: #000; }
    .box { fill: #fff; stroke: #000; stroke-width: 1.7; }
    .group { fill: #fff; stroke: #000; stroke-width: 1.7; stroke-dasharray: 9 7; }
    .barrier { fill: #f7f7f7; stroke: #000; stroke-width: 1.7; stroke-dasharray: 6 5; }
    .line { fill: none; stroke: #000; stroke-width: 1.7; marker-end: url(#arrow); }
    .dashline { fill: none; stroke: #000; stroke-width: 1.7; stroke-dasharray: 7 5; marker-end: url(#arrow); }
    .plain { fill: none; stroke: #000; stroke-width: 1.7; }
    .dashplain { fill: none; stroke: #000; stroke-width: 1.7; stroke-dasharray: 7 5; }
  </style>
</defs>
<rect width="1600" height="1240" fill="#fff"/><rect class="box" x="500" y="35" width="600" height="75" rx="4"/><text text-anchor="middle" style="font-size:18px"><tspan x="800" y="78.5">视频 V、问题 Q、任务规则</tspan></text><rect class="box" x="500" y="150" width="600" height="82" rx="4"/><text text-anchor="middle" style="font-size:18px"><tspan x="800" y="184.5">I0 初始状态单元</tspan><tspan x="800" y="209.5">形成 E0 与 A0</tspan></text><rect class="box" x="500" y="275" width="600" height="82" rx="4"/><text text-anchor="middle" style="font-size:18px"><tspan x="800" y="309.5">增量证据单元</tspan><tspan x="800" y="334.5">取得 ΔE 并冻结 E+</tspan></text><rect class="group" x="45" y="425" width="650" height="455" rx="8"/><text x="370" y="463" text-anchor="middle">第一读取域：证据许可域</text><rect class="box" x="115" y="500" width="510" height="78" rx="4"/><text text-anchor="middle" style="font-size:18px"><tspan x="370" y="545">P1 可读：Q、规则、E0、ΔE、E+</tspan></text><rect class="box" x="115" y="620" width="510" height="78" rx="4"/><text text-anchor="middle" style="font-size:18px"><tspan x="370" y="665">P2 同槽模式观测与证据差分</tspan></text><rect class="box" x="115" y="740" width="510" height="78" rx="4"/><text text-anchor="middle" style="font-size:18px"><tspan x="370" y="785">P3 冻结证据差分许可</tspan></text><rect class="box" x="195" y="825" width="350" height="62" rx="4"/><text text-anchor="middle" style="font-size:16px"><tspan x="370" y="862">控制存储区：许可摘要</tspan></text><rect class="group" x="905" y="425" width="650" height="455" rx="8"/><text x="1230" y="463" text-anchor="middle">第二读取域：候选生成域</text><rect class="box" x="975" y="500" width="510" height="78" rx="4"/><text text-anchor="middle" style="font-size:18px"><tspan x="1230" y="545">G1 可读：Q 与 E+ 原始视频证据表示</tspan></text><rect class="box" x="975" y="640" width="510" height="78" rx="4"/><text text-anchor="middle" style="font-size:18px"><tspan x="1230" y="685">G2 独立生成并冻结 A2</tspan></text><rect class="box" x="1055" y="790" width="350" height="62" rx="4"/><text text-anchor="middle" style="font-size:16px"><tspan x="1230" y="827">候选存储区：A2 摘要</tspan></text><rect class="barrier" x="735" y="505" width="130" height="270" rx="4"/><text text-anchor="middle" style="font-size:16px"><tspan x="800" y="600">逻辑隔离边界</tspan><tspan x="800" y="623">A0 与许可字段</tspan><tspan x="800" y="646">不得进入候选域</tspan><tspan x="800" y="669">候选结果不得</tspan><tspan x="800" y="692">反向影响许可</tspan></text><rect class="box" x="65" y="980" width="360" height="95" rx="4"/><text text-anchor="middle" style="font-size:16px"><tspan x="245" y="1022">A0 语义存储区</tspan><tspan x="245" y="1045">两读取域均无读取权限</tspan></text><rect class="box" x="620" y="950" width="360" height="112" rx="4"/><text text-anchor="middle" style="font-size:16px"><tspan x="800" y="989">联合控制单元</tspan><tspan x="800" y="1012">A2 冻结后首次读取 A0、A2 与许可</tspan><tspan x="800" y="1035">同 E+ 完成迁移—许可配准</tspan></text><rect class="box" x="1130" y="970" width="400" height="82" rx="4"/><text text-anchor="middle" style="font-size:18px"><tspan x="1330" y="1017">依赖闭包与原子写入门禁</tspan></text><rect class="box" x="1130" y="1100" width="400" height="82" rx="4"/><text text-anchor="middle" style="font-size:18px"><tspan x="1330" y="1147">受限重组、终检或安全状态输出</tspan></text><path class="line" d="M800,110 L800,150"/><path class="line" d="M800,232 L800,275"/><path class="plain" d="M800,357 L800,395 L370,395"/><path class="plain" d="M800,395 L1230,395"/><path class="line" d="M370,395 L370,500"/><path class="line" d="M1230,395 L1230,500"/><path class="line" d="M370,578 L370,620"/><path class="line" d="M370,698 L370,740"/><path class="line" d="M370,818 L370,825"/><path class="line" d="M1230,578 L1230,640"/><path class="line" d="M1230,718 L1230,790"/><path class="dashline" d="M370,887 L370,915 L710,915 L710,950"/><path class="line" d="M1230,852 L1230,915 L890,915 L890,950"/><path class="line" d="M425,1027 L620,1027"/><path class="line" d="M980,1006 L1130,1006"/><path class="line" d="M1330,1052 L1330,1100"/><path class="dashplain" d="M545,780 L705,780"/><path class="plain" d="M705,768 L705,792"/><path class="dashplain" d="M895,605 L865,605"/><path class="plain" d="M895,593 L895,617"/></svg>