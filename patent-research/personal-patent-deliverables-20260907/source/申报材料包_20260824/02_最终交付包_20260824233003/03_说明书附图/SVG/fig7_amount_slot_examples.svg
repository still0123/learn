<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1150" viewBox="0 0 1600 1150">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#000"/></marker>
    <style>
      text { font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 18px; fill: #000; }
      .small { font-size: 16px; }
      .tiny { font-size: 14px; }
      .box { fill: #fff; stroke: #000; stroke-width: 1.7; }
      .dash { fill: #fff; stroke: #000; stroke-width: 1.7; stroke-dasharray: 8 6; }
      .line { fill: none; stroke: #000; stroke-width: 1.7; marker-end: url(#arrow); }
      .plain { fill: none; stroke: #000; stroke-width: 1.7; }
      .dashed-line { fill: none; stroke: #000; stroke-width: 1.7; stroke-dasharray: 7 5; marker-end: url(#arrow); }
      .blocked-line { fill: none; stroke: #000; stroke-width: 1.7; stroke-dasharray: 7 5; }
    </style>
  </defs>
  <rect width="1600" height="1150" fill="#fff"/><rect class="dash" x="45" y="45" width="1510" height="270" rx="8"/><text class="" text-anchor="middle"><tspan x="800" y="83">共同的初始状态、增量视频见证和证据差分许可</tspan></text><rect class="box" x="85" y="115" width="390" height="125" rx="3"/><text class="small" text-anchor="middle"><tspan x="280" y="161.5">701 问题、E0 与 A0</tspan><tspan x="280" y="183.5">问题：视频宣称每年最高可节省多少？</tspan><tspan x="280" y="205.5">E0 含前序£95提示，未覆盖结尾汇总画面；A0=£95</tspan></text><rect class="box" x="550" y="105" width="500" height="155" rx="3"/><text class="small" text-anchor="middle"><tspan x="800" y="135">702 增量视频证据 ΔE 及其时空模态见证</tspan></text><rect class="dash" x="590" y="160" width="420" height="70" rx="3"/><text class="small" text-anchor="middle"><tspan x="800" y="185">ROI/OCR：Save up to £340 a year</tspan><tspan x="800" y="207">原视频时间区间：27.08 s—29.96 s</tspan></text><text class="tiny" text-anchor="middle"><tspan x="800" y="250">按问题与任务规则取得；不以 A0 值为取证目标</tspan></text><rect class="box" x="1125" y="115" width="390" height="125" rx="3"/><text class="small" text-anchor="middle"><tspan x="1320" y="161.5">703 证据差分许可记录 P340</tspan><tspan x="1320" y="183.5">许可服务不读取 A0；年度节省槽 O0 未解析</tspan><tspan x="1320" y="205.5">顶部 ROI 中 O+ 唯一解析£340；t_p 冻结</tspan></text><path class="line" d="M475,177 L550,177"/><path class="line" d="M1050,177 L1125,177"/><rect class="dash" x="45" y="375" width="725" height="720" rx="8"/><text class="" text-anchor="middle"><tspan x="407.5" y="413">图7(a) 候选与许可一致：允许写入</tspan></text><rect class="box" x="130" y="455" width="555" height="105" rx="3"/><text class="small" text-anchor="middle"><tspan x="407.5" y="491.5">704 隔离生成并冻结候选答案 A2=£340</tspan><tspan x="407.5" y="513.5">候选服务仅读问题与 E+ 原始表示，不读取 A0 或许可</tspan><tspan x="407.5" y="535.5">在 t_s 后生成并于 t_a 冻结</tspan></text><rect class="box" x="130" y="635" width="555" height="155" rx="3"/><text class="small" text-anchor="middle"><tspan x="407.5" y="696.5">705 在 t_j 后读取 P340，并于同一 E+ 下核验和唯一配准</tspan><tspan x="407.5" y="718.5">A0=£95：CONFLICT；A2=£340：SUPPORT</tspan><tspan x="407.5" y="740.5">A0→A2迁移的目标事实与许可在槽、上下文、值、快照和见证上均一致</tspan></text><rect class="box" x="130" y="875" width="555" height="105" rx="3"/><text class="small" text-anchor="middle"><tspan x="407.5" y="922.5">706 闭包原子提交并允许输出</tspan><tspan x="407.5" y="944.5">annual_saving_up_to=£340</tspan></text><path class="line" d="M407,560 L407,635"/><path class="line" d="M407,790 L407,875"/><rect class="dash" x="830" y="375" width="725" height="720" rx="8"/><text class="" text-anchor="middle"><tspan x="1192.5" y="413">图7(b) 候选与许可不一致：安全禁止写入</tspan></text><rect class="box" x="915" y="455" width="555" height="105" rx="3"/><text class="small" text-anchor="middle"><tspan x="1192.5" y="491.5">707 隔离生成并冻结候选答案 A2=£100</tspan><tspan x="1192.5" y="513.5">候选服务仅读问题与 E+ 原始表示，不读取 A0 或许可</tspan><tspan x="1192.5" y="535.5">在 t_s 后生成并于 t_a 冻结</tspan></text><rect class="box" x="915" y="615" width="555" height="145" rx="3"/><text class="small" text-anchor="middle"><tspan x="1192.5" y="671.5">708 在 t_j 后读取 P340，并于同一 E+ 下核验及配准失败</tspan><tspan x="1192.5" y="693.5">A0=£95：CONFLICT；A2=£100：INSUFFICIENT</tspan><tspan x="1192.5" y="715.5">不存在与 £100 对应的唯一有效许可</tspan></text><rect class="box" x="915" y="815" width="555" height="90" rx="3"/><text class="small" text-anchor="middle"><tspan x="1192.5" y="866">709 禁止写入闭包中的全部候选目标事实</tspan></text><rect class="box" x="915" y="955" width="555" height="105" rx="3"/><text class="small" text-anchor="middle"><tspan x="1192.5" y="1002.5">710 继续取证；预算耗尽时输出证据不足或拒答</tspan><tspan x="1192.5" y="1024.5">不得恢复 E+ 下已冲突的 A0 事实</tspan></text><path class="line" d="M1192,560 L1192,615"/><path class="line" d="M1192,760 L1192,815"/><path class="line" d="M1192,905 L1192,955"/><path class="plain" d="M407,350 L1192,350"/><path class="line" d="M800,260 L800,350"/><path class="line" d="M407,350 L407,455"/><path class="line" d="M1192,350 L1192,455"/><text class="tiny" text-anchor="middle"><tspan x="800" y="1130">本图数值、时间和事实槽仅用于说明处理流程，不限定其他视频内容、模态或事实类型</tspan></text></svg>