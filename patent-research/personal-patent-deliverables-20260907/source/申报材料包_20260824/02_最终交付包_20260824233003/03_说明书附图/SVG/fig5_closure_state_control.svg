<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1600" viewBox="0 0 1600 1600">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#000"/></marker>
    <style>
      text { font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 18px; fill: #000; }
      .small { font-size: 16px; }
      .tiny { font-size: 14px; }
      .box { fill: #fff; stroke: #000; stroke-width: 1.7; }
      .dash { fill: #fff; stroke: #000; stroke-width: 1.7; stroke-dasharray: 8 6; }
      .line { fill: none; stroke: #000; stroke-width: 1.7; marker-end: url(#arrow); }
      .plain { fill: none; stroke: #000; stroke-width: 1.7; }
      .dashed-line { fill: none; stroke: #000; stroke-width: 1.7; stroke-dasharray: 7 5; marker-end: url(#arrow); }
      .blocked-line { fill: none; stroke: #000; stroke-width: 1.7; stroke-dasharray: 7 5; }
    </style>
  </defs>
  <rect width="1600" height="1600" fill="#fff"/><rect class="dash" x="45" y="45" width="440" height="500" rx="8"/><text class="" text-anchor="middle"><tspan x="265" y="83">517 上游只读证明上下文</tspan></text><rect class="dash" x="560" y="45" width="995" height="500" rx="8"/><text class="" text-anchor="middle"><tspan x="1057.5" y="83">518 下游事务写入闭包</tspan></text><rect class="box" x="100" y="145" width="330" height="88" rx="3"/><text class="" text-anchor="middle"><tspan x="265" y="195">501 商品身份前提</tspan></text><rect class="box" x="100" y="315" width="330" height="88" rx="3"/><text class="" text-anchor="middle"><tspan x="265" y="365">502 促销时间前提</tspan></text><rect class="box" x="620" y="135" width="280" height="95" rx="3"/><text class="" text-anchor="middle"><tspan x="760" y="176.5">503 实质迁移</tspan><tspan x="760" y="200.5">促销价格</tspan></text><rect class="box" x="960" y="135" width="280" height="95" rx="3"/><text class="" text-anchor="middle"><tspan x="1100" y="176.5">504 派生许可及迁移</tspan><tspan x="1100" y="200.5">优惠金额</tspan></text><rect class="box" x="1300" y="135" width="220" height="95" rx="3"/><text class="small" text-anchor="middle"><tspan x="1410" y="188.5">505 下游结论迁移</tspan></text><rect class="box" x="650" y="350" width="400" height="105" rx="3"/><text class="" text-anchor="middle"><tspan x="850" y="396.5">506 闭包记录</tspan><tspan x="850" y="420.5">写入集—证明引用集—迁移许可映射</tspan></text><rect class="box" x="1120" y="340" width="400" height="115" rx="3"/><text class="small" text-anchor="middle"><tspan x="1320" y="381.5">519 共享节点发生非等价状态改变</tspan><tspan x="1320" y="403.5">关联闭包核验失效并重核验</tspan><tspan x="1320" y="425.5">仍冲突时合并为联合闭包</tspan></text><path class="dashed-line" d="M430,189 L620,189"/><text class="small" x="508" y="168">只读引用</text><path class="dashed-line" d="M430,359 L520,359 L520,210 L620,210"/><text class="small" x="463" y="338">只读引用</text><path class="line" d="M900,182 L960,182"/><path class="line" d="M1240,182 L1300,182"/><path class="dashed-line" d="M850,350 L850,230"/><text class="small" x="873" y="293">许可约束</text><path class="dashed-line" d="M700,230 L700,285 L1090,285 L1090,397 L1120,397"/><text class="small" x="938" y="263">共享节点改变</text><path class="dashed-line" d="M1120,430 L1050,430"/><text class="small" x="1048" y="448">重核验结果</text><polygon class="box" points="800,625 1180,690 800,755 420,690"/><text class="" text-anchor="middle"><tspan x="800" y="684">507 闭包内全部迁移是否唯一获许可，</tspan><tspan x="800" y="708">且快照有效、无竞争事实？</tspan></text><rect class="box" x="100" y="815" width="430" height="90" rx="3"/><text class="" text-anchor="middle"><tspan x="315" y="866">508 原子提交闭包全部目标状态</tspan></text><rect class="box" x="1075" y="815" width="430" height="90" rx="3"/><text class="" text-anchor="middle"><tspan x="1290" y="866">509 丢弃闭包全部候选写入</tspan></text><polygon class="box" points="1290,965 1530,1020 1290,1075 1050,1020"/><text class="small" text-anchor="middle"><tspan x="1290" y="1026">510 E+ 下旧事实状态？</tspan></text><rect class="box" x="540" y="1160" width="280" height="82" rx="3"/><text class="" text-anchor="middle"><tspan x="680" y="1207">511 保留受支持旧事实</tspan></text><rect class="box" x="900" y="1160" width="320" height="82" rx="3"/><text class="" text-anchor="middle"><tspan x="1060" y="1207">512 继续取证或设为不确定</tspan></text><rect class="box" x="1280" y="1160" width="280" height="82" rx="3"/><text class="" text-anchor="middle"><tspan x="1420" y="1207">513 撤回冲突旧事实</tspan></text><polygon class="box" points="1050,1305 1300,1360 1050,1415 800,1360"/><text class="small" text-anchor="middle"><tspan x="1050" y="1355">514 必填事实槽</tspan><tspan x="1050" y="1377">是否可唯一填充？</tspan></text><rect class="box" x="220" y="1490" width="620" height="80" rx="3"/><text class="small" text-anchor="middle"><tspan x="530" y="1536">515 仅由已提交或保留事实受限重组并输出</tspan></text><rect class="box" x="1050" y="1490" width="450" height="80" rx="3"/><text class="small" text-anchor="middle"><tspan x="1275" y="1536">516 输出证据不足状态或拒答</tspan></text><path class="line" d="M800,545 L800,625"/><path class="line" d="M420,690 L315,690 L315,815"/><text class="small" x="343" y="668">是</text><path class="line" d="M1180,690 L1290,690 L1290,815"/><text class="small" x="1218" y="668">否</text><path class="line" d="M315,905 L315,1490"/><path class="line" d="M1290,905 L1290,965"/><path class="line" d="M1050,1020 L680,1020 L680,1160"/><text class="small" x="858" y="998">支持</text><path class="line" d="M1290,1075 L1060,1075 L1060,1160"/><text class="small" x="1128" y="1053">证据不足</text><path class="line" d="M1530,1020 L1420,1020 L1420,1160"/><text class="small" x="1458" y="998">冲突</text><path class="plain" d="M680,1275 L1420,1275"/><path class="line" d="M680,1242 L680,1275"/><path class="line" d="M1060,1242 L1060,1275"/><path class="line" d="M1420,1242 L1420,1275"/><path class="line" d="M1050,1275 L1050,1305"/><path class="line" d="M800,1360 L530,1360 L530,1490"/><text class="small" x="698" y="1338">是</text><path class="line" d="M1300,1360 L1275,1360 L1275,1490"/><text class="small" x="1288" y="1338">否</text></svg>