<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1900" viewBox="0 0 1200 1900">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#000"/></marker>
    <style>
      text { font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 18px; fill: #000; }
      .small { font-size: 16px; }
      .tiny { font-size: 14px; }
      .box { fill: #fff; stroke: #000; stroke-width: 1.7; }
      .dash { fill: #fff; stroke: #000; stroke-width: 1.7; stroke-dasharray: 8 6; }
      .line { fill: none; stroke: #000; stroke-width: 1.7; marker-end: url(#arrow); }
      .plain { fill: none; stroke: #000; stroke-width: 1.7; }
      .dashed-line { fill: none; stroke: #000; stroke-width: 1.7; stroke-dasharray: 7 5; marker-end: url(#arrow); }
      .blocked-line { fill: none; stroke: #000; stroke-width: 1.7; stroke-dasharray: 7 5; }
    </style>
  </defs>
  <rect width="1200" height="1900" fill="#fff"/><rect class="box" x="280" y="35" width="640" height="88" rx="3"/><text class="" text-anchor="middle"><tspan x="600" y="73">101 获取视频、问题、初始证据快照 E0</tspan><tspan x="600" y="97">并基于 E0 生成初始答案 A0</tspan></text><rect class="box" x="280" y="157" width="640" height="88" rx="3"/><text class="" text-anchor="middle"><tspan x="600" y="195">102 根据问题与任务规则确定规范化事实槽</tspan><tspan x="600" y="219">事实槽不由 A0 或 A2 的事实值生成</tspan></text><rect class="box" x="280" y="279" width="640" height="88" rx="3"/><text class="" text-anchor="middle"><tspan x="600" y="317">103 获取 E0 未使用的增量视频证据 ΔE</tspan><tspan x="600" y="341">并冻结扩展视频证据快照 E+</tspan></text><rect class="box" x="280" y="401" width="640" height="88" rx="3"/><text class="" text-anchor="middle"><tspan x="600" y="439">104 证据许可服务在第一读取域内比较 E0/E+</tspan><tspan x="600" y="463">形成由 ΔE 见证的证据事实差分 ΔObs</tspan></text><rect class="box" x="280" y="523" width="640" height="88" rx="3"/><text class="" text-anchor="middle"><tspan x="600" y="561">105 冻结证据差分许可摘要并记录 t_p</tspan><tspan x="600" y="585">许可值、状态和映射标识对生成器不可读</tspan></text><rect class="box" x="280" y="645" width="640" height="88" rx="3"/><text class="" text-anchor="middle"><tspan x="600" y="683">106 在 t_s 后由候选服务在第二读取域内</tspan><tspan x="600" y="707">仅根据问题与 E+ 原始证据表示生成 A2</tspan></text><rect class="box" x="280" y="767" width="640" height="88" rx="3"/><text class="" text-anchor="middle"><tspan x="600" y="805">107 在 t_a 冻结 A2 内容摘要及版本</tspan><tspan x="600" y="829">在 t_j 首次开放 A0、A2 与许可联合读取</tspan></text><rect class="box" x="280" y="889" width="640" height="88" rx="3"/><text class="" text-anchor="middle"><tspan x="600" y="927">108 在同一 E+ 和同一配置下核验 A0 与 A2</tspan><tspan x="600" y="951">形成实质答案事实迁移 ΔAns</tspan></text><rect class="box" x="280" y="1011" width="640" height="88" rx="3"/><text class="" text-anchor="middle"><tspan x="600" y="1049">109 迁移与许可按槽、实体或事件、谓词、上下文和值</tspan><tspan x="600" y="1073">以及快照和 ΔE 时空模态见证逐项配准</tspan></text><rect class="box" x="280" y="1133" width="640" height="78" rx="3"/><text class="" text-anchor="middle"><tspan x="600" y="1178">110 根据有向事实依赖关系构造语义依赖闭包</tspan></text><polygon class="box" points="600,1245 980,1317 600,1389 220,1317"/><text class="" text-anchor="middle"><tspan x="600" y="1311">111 闭包内全部实质迁移是否唯一配准，</tspan><tspan x="600" y="1335">快照有效且不存在竞争事实？</tspan></text><rect class="box" x="95" y="1442" width="430" height="92" rx="3"/><text class="" text-anchor="middle"><tspan x="310" y="1494">112 原子写入闭包的全部目标事实状态</tspan></text><rect class="box" x="675" y="1442" width="430" height="92" rx="3"/><text class="" text-anchor="middle"><tspan x="890" y="1482">113 禁止写入闭包的全部候选状态</tspan><tspan x="890" y="1506">并执行 E+ 下安全状态转移</tspan></text><rect class="box" x="280" y="1597" width="640" height="92" rx="3"/><text class="" text-anchor="middle"><tspan x="600" y="1637">114 仅由已提交目标事实和受支持旧事实重组</tspan><tspan x="600" y="1661">并执行无新增事实终检</tspan></text><rect class="box" x="280" y="1742" width="640" height="82" rx="3"/><text class="" text-anchor="middle"><tspan x="600" y="1789">115 输出答案、证据不足状态或拒绝回答</tspan></text><path class="line" d="M600,123 L600,157"/><path class="line" d="M600,245 L600,279"/><path class="line" d="M600,367 L600,401"/><path class="line" d="M600,489 L600,523"/><path class="line" d="M600,611 L600,645"/><path class="line" d="M600,733 L600,767"/><path class="line" d="M600,855 L600,889"/><path class="line" d="M600,977 L600,1011"/><path class="line" d="M600,1099 L600,1133"/><path class="line" d="M600,1211 L600,1245"/><path class="line" d="M390,1377 L310,1442"/><text class="small" x="398" y="1396">是</text><path class="line" d="M810,1377 L890,1442"/><text class="small" x="803" y="1396">否</text><path class="line" d="M310,1534 L310,1573 L480,1573 L480,1597"/><path class="line" d="M890,1534 L890,1573 L720,1573 L720,1597"/><path class="line" d="M600,1689 L600,1742"/></svg>