<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#000"/></marker>
    <style>
      text { font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 18px; fill: #000; }
      .small { font-size: 16px; }
      .tiny { font-size: 14px; }
      .box { fill: #fff; stroke: #000; stroke-width: 1.7; }
      .dash { fill: #fff; stroke: #000; stroke-width: 1.7; stroke-dasharray: 8 6; }
      .line { fill: none; stroke: #000; stroke-width: 1.7; marker-end: url(#arrow); }
      .plain { fill: none; stroke: #000; stroke-width: 1.7; }
      .dashed-line { fill: none; stroke: #000; stroke-width: 1.7; stroke-dasharray: 7 5; marker-end: url(#arrow); }
      .blocked-line { fill: none; stroke: #000; stroke-width: 1.7; stroke-dasharray: 7 5; }
    </style>
  </defs>
  <rect width="1600" height="1180" fill="#fff"/><rect class="dash" x="30" y="30" width="1540" height="1100" rx="8"/><text class="" text-anchor="middle"><tspan x="800" y="68">视频问答答案更新方法执行模块</tspan></text><rect class="box" x="110" y="100" width="420" height="110" rx="3"/><text class="" text-anchor="middle"><tspan x="320" y="137">609 存储器</tspan><tspan x="320" y="161">保存证据快照、许可、A0/A2</tspan><tspan x="320" y="185">迁移、闭包及审计日志</tspan></text><rect class="box" x="1070" y="100" width="420" height="110" rx="3"/><text class="" text-anchor="middle"><tspan x="1280" y="149">610 处理器</tspan><tspan x="1280" y="173">执行各功能单元</tspan></text><rect class="box" x="690" y="120" width="220" height="70" rx="3"/><text class="small" text-anchor="middle"><tspan x="800" y="150">执行架构内部</tspan><tspan x="800" y="172">数据与控制总线</tspan></text><path class="line" d="M530,155 L690,155"/><path class="line" d="M1070,155 L910,155"/><rect class="box" x="500" y="280" width="600" height="72" rx="3"/><text class="" text-anchor="middle"><tspan x="800" y="310">601 初始状态生成单元</tspan><tspan x="800" y="334">获取视频、问题、E0并生成A0</tspan></text><rect class="box" x="500" y="378" width="600" height="72" rx="3"/><text class="" text-anchor="middle"><tspan x="800" y="408">602 增量证据获取单元</tspan><tspan x="800" y="432">取得E0未用ΔE并冻结E+</tspan></text><path class="line" d="M800,352 L800,378"/><rect class="box" x="500" y="476" width="600" height="72" rx="3"/><text class="" text-anchor="middle"><tspan x="800" y="506">603 证据许可单元</tspan><tspan x="800" y="530">在第一读取域形成并冻结证据差分许可</tspan></text><path class="line" d="M800,450 L800,476"/><rect class="box" x="500" y="574" width="600" height="72" rx="3"/><text class="" text-anchor="middle"><tspan x="800" y="604">604 隔离候选生成单元</tspan><tspan x="800" y="628">在第二读取域仅由问题与E+原始证据生成A2</tspan></text><path class="line" d="M800,548 L800,574"/><rect class="box" x="500" y="672" width="600" height="72" rx="3"/><text class="" text-anchor="middle"><tspan x="800" y="690">605 联合控制单元</tspan><tspan x="800" y="714">A2冻结后联合读取A0、A2与许可</tspan><tspan x="800" y="738">同E+形成实质事实迁移</tspan></text><path class="line" d="M800,646 L800,672"/><rect class="box" x="500" y="770" width="600" height="72" rx="3"/><text class="" text-anchor="middle"><tspan x="800" y="800">606 迁移配准子单元</tspan><tspan x="800" y="824">按槽、上下文、值、快照和ΔE见证逐项配准</tspan></text><path class="line" d="M800,744 L800,770"/><rect class="box" x="500" y="868" width="600" height="72" rx="3"/><text class="" text-anchor="middle"><tspan x="800" y="898">607 闭包控制单元</tspan><tspan x="800" y="922">闭包原子写入或禁止候选状态</tspan></text><path class="line" d="M800,842 L800,868"/><rect class="box" x="500" y="966" width="600" height="72" rx="3"/><text class="" text-anchor="middle"><tspan x="800" y="996">608 受限输出单元</tspan><tspan x="800" y="1020">输出答案、不确定状态或拒答</tspan></text><path class="line" d="M800,940 L800,966"/><path class="line" d="M800,190 L800,280"/><rect class="box" x="70" y="515" width="360" height="150" rx="3"/><text class="" text-anchor="middle"><tspan x="250" y="572">611 访问控制与接口校验单元</tspan><tspan x="250" y="596">隔离第一读取域与第二读取域</tspan><tspan x="250" y="620">并校验候选生成输入</tspan></text><path class="dashed-line" d="M430,555 L470,555 L470,512 L500,512"/><path class="dashed-line" d="M430,625 L470,625 L470,610 L500,610"/></svg>