<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1200" viewBox="0 0 1500 1200">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#000"/></marker>
    <style>
      text { font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 18px; fill: #000; }
      .small { font-size: 16px; }
      .box { fill: #fff; stroke: #000; stroke-width: 1.7; }
      .dash { fill: #fff; stroke: #000; stroke-width: 1.7; stroke-dasharray: 8 6; }
      .line { fill: none; stroke: #000; stroke-width: 1.7; marker-end: url(#arrow); }
      .plain { fill: none; stroke: #000; stroke-width: 1.7; }
      .dashed-line { fill: none; stroke: #000; stroke-width: 1.7; stroke-dasharray: 7 5; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1500" height="1200" fill="#fff"/><rect class="box" x="480" y="40" width="540" height="82" rx="3"/><text text-anchor="middle"><tspan x="750" y="75">501 输入获取模块</tspan><tspan x="750" y="99">视频、问题和 E0</tspan></text><rect class="box" x="480" y="164" width="540" height="82" rx="3"/><text text-anchor="middle"><tspan x="750" y="199">502 初始答案与支持评估模块</tspan><tspan x="750" y="223">A0、原子声明及支持状态</tspan></text><path class="line" d="M750,122 L750,164"/><rect class="box" x="480" y="288" width="540" height="82" rx="3"/><text text-anchor="middle"><tspan x="750" y="323">503 增量证据获取模块</tspan><tspan x="750" y="347">未覆盖位置 ΔE 与 E+</tspan></text><path class="line" d="M750,246 L750,288"/><rect class="box" x="480" y="412" width="540" height="82" rx="3"/><text text-anchor="middle"><tspan x="750" y="447">504 独立候选生成模块</tspan><tspan x="750" y="471">仅由问题和 E+ 生成 A2</tspan></text><path class="line" d="M750,370 L750,412"/><rect class="box" x="480" y="536" width="540" height="82" rx="3"/><text text-anchor="middle"><tspan x="750" y="571">505 映射与闭包构造模块</tspan><tspan x="750" y="595">迁移记录、写入闭包和证明上下文</tspan></text><path class="line" d="M750,494 L750,536"/><rect class="box" x="480" y="660" width="540" height="82" rx="3"/><text text-anchor="middle"><tspan x="750" y="695">506 见证核验与提交控制模块</tspan><tspan x="750" y="719">同 E+ 复评、提交或安全状态</tspan></text><path class="line" d="M750,618 L750,660"/><rect class="box" x="480" y="784" width="540" height="82" rx="3"/><text text-anchor="middle"><tspan x="750" y="819">507 受约束输出模块</tspan><tspan x="750" y="843">重组与无新增声明终检</tspan></text><path class="line" d="M750,742 L750,784"/><rect class="box" x="80" y="340" width="270" height="105" rx="3"/><text text-anchor="middle"><tspan x="215" y="386.5">508 存储器</tspan><tspan x="215" y="410.5">保存证据快照、声明与状态</tspan></text><rect class="box" x="1150" y="340" width="270" height="105" rx="3"/><text text-anchor="middle"><tspan x="1285" y="386.5">509 处理器</tspan><tspan x="1285" y="410.5">执行各功能模块</tspan></text><path class="line" d="M350,392 L480,392"/><text class="small" x="488" y="385">数据</text><path class="line" d="M1150,392 L1020,392"/><text class="small" x="1028" y="385">控制</text></svg>