<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#000"/></marker>
    <style>
      text { font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 18px; fill: #000; }
      .small { font-size: 16px; }
      .tiny { font-size: 14px; }
      .box { fill: #fff; stroke: #000; stroke-width: 1.7; }
      .dash { fill: #fff; stroke: #000; stroke-width: 1.7; stroke-dasharray: 8 6; }
      .line { fill: none; stroke: #000; stroke-width: 1.7; marker-end: url(#arrow); }
      .plain { fill: none; stroke: #000; stroke-width: 1.7; }
      .dashed-line { fill: none; stroke: #000; stroke-width: 1.7; stroke-dasharray: 7 5; marker-end: url(#arrow); }
      .blocked-line { fill: none; stroke: #000; stroke-width: 1.7; stroke-dasharray: 7 5; }
    </style>
  </defs>
  <rect width="1600" height="1080" fill="#fff"/><rect class="box" x="65" y="70" width="360" height="92" rx="3"/><text class="" text-anchor="middle"><tspan x="245" y="110">201 第一读取域输入</tspan><tspan x="245" y="134">问题 Q、任务规则、E0、ΔE 与 E+</tspan></text><rect class="box" x="1175" y="70" width="360" height="92" rx="3"/><text class="" text-anchor="middle"><tspan x="1355" y="110">207 第二读取域输入</tspan><tspan x="1355" y="134">问题 Q 与 E+ 原始证据表示</tspan></text><rect class="dash" x="45" y="210" width="650" height="570" rx="8"/><text class="" text-anchor="middle"><tspan x="370" y="248">213 第一读取域：证据许可服务</tspan></text><rect class="dash" x="905" y="210" width="650" height="570" rx="8"/><text class="" text-anchor="middle"><tspan x="1230" y="248">214 第二读取域：候选生成服务</tspan></text><rect class="box" x="115" y="285" width="510" height="82" rx="3"/><text class="" text-anchor="middle"><tspan x="370" y="332">202 E0/E+ 观测抽取与规范化</tspan></text><rect class="box" x="115" y="415" width="510" height="82" rx="3"/><text class="" text-anchor="middle"><tspan x="370" y="462">203 比较观测状态并形成 ΔObs</tspan></text><rect class="box" x="115" y="545" width="510" height="82" rx="3"/><text class="" text-anchor="middle"><tspan x="370" y="592">204 冻结证据差分许可摘要并记录 t_p</tspan></text><rect class="box" x="195" y="665" width="350" height="92" rx="3"/><text class="" text-anchor="middle"><tspan x="370" y="705">205 许可控制存储区</tspan><tspan x="370" y="729">许可值—状态—ID—映射键</tspan></text><rect class="box" x="975" y="285" width="510" height="82" rx="3"/><text class="" text-anchor="middle"><tspan x="1230" y="320">208 白名单候选生成接口</tspan><tspan x="1230" y="344">拒绝 A0、许可及改写字段</tspan></text><rect class="box" x="975" y="415" width="510" height="82" rx="3"/><text class="" text-anchor="middle"><tspan x="1230" y="462">209 候选答案生成器</tspan></text><rect class="box" x="1055" y="545" width="350" height="82" rx="3"/><text class="" text-anchor="middle"><tspan x="1230" y="580">210 A2 存储区</tspan><tspan x="1230" y="604">在 t_a 冻结内容摘要与版本</tspan></text><rect class="box" x="70" y="850" width="320" height="92" rx="3"/><text class="small" text-anchor="middle"><tspan x="230" y="891">206 A0 语义存储区</tspan><tspan x="230" y="913">第一、第二读取域均无读取权限</tspan></text><rect class="box" x="645" y="840" width="310" height="112" rx="3"/><text class="" text-anchor="middle"><tspan x="800" y="878">211 控制服务</tspan><tspan x="800" y="902">仅在 A2 冻结后的 t_j</tspan><tspan x="800" y="926">执行首次联合读取</tspan></text><rect class="box" x="1210" y="850" width="325" height="92" rx="3"/><text class="" text-anchor="middle"><tspan x="1372.5" y="902">212 双差分配准与闭包提交</tspan></text><rect class="dash" x="735" y="315" width="130" height="285" rx="3"/><text class="small" text-anchor="middle"><tspan x="800" y="419.5">逻辑隔离边界</tspan><tspan x="800" y="441.5">A0 与许可字段</tspan><tspan x="800" y="463.5">不得进入候选域</tspan><tspan x="800" y="485.5">候选结果不得</tspan><tspan x="800" y="507.5">反向影响许可</tspan></text><path class="line" d="M245,162 L245,285"/><path class="line" d="M1355,162 L1355,285"/><path class="line" d="M370,367 L370,415"/><path class="line" d="M370,497 L370,545"/><path class="line" d="M370,627 L370,665"/><path class="line" d="M1230,367 L1230,415"/><path class="line" d="M1230,497 L1230,545"/><path class="blocked-line" d="M545,710 L705,710"/><path class="plain" d="M705,698 L705,722"/><text class="small" x="625" y="700" text-anchor="middle">禁止跨域</text><path class="blocked-line" d="M230,850 L230,790"/><path class="plain" d="M218,790 L242,790"/><text class="small" x="230" y="810" text-anchor="middle">禁止读取 A0</text><path class="dashed-line" d="M370,757 L370,810 L720,810 L720,840"/><text class="small" x="463" y="818">于 t_j 读取</text><path class="line" d="M1230,627 L1230,810 L880,810 L880,840"/><text class="small" x="1088" y="818">A2 摘要</text><path class="line" d="M390,896 L645,896"/><path class="line" d="M955,896 L1210,896"/></svg>