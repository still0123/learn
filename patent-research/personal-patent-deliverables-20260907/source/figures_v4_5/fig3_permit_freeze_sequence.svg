<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1180" viewBox="0 0 1500 1180">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#000"/></marker>
    <style>
      text { font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 18px; fill: #000; }
      .small { font-size: 16px; }
      .tiny { font-size: 14px; }
      .box { fill: #fff; stroke: #000; stroke-width: 1.7; }
      .dash { fill: #fff; stroke: #000; stroke-width: 1.7; stroke-dasharray: 8 6; }
      .line { fill: none; stroke: #000; stroke-width: 1.7; marker-end: url(#arrow); }
      .plain { fill: none; stroke: #000; stroke-width: 1.7; }
      .dashed-line { fill: none; stroke: #000; stroke-width: 1.7; stroke-dasharray: 7 5; marker-end: url(#arrow); }
      .blocked-line { fill: none; stroke: #000; stroke-width: 1.7; stroke-dasharray: 7 5; }
    </style>
  </defs>
  <rect width="1500" height="1180" fill="#fff"/><rect class="box" x="490" y="40" width="520" height="78" rx="3"/><text class="" text-anchor="middle"><tspan x="750" y="85">301 由问题与任务规则形成事实槽模式</tspan></text><rect class="box" x="490" y="160" width="520" height="78" rx="3"/><text class="" text-anchor="middle"><tspan x="750" y="205">302 在 E0 下形成初始观测状态 O0</tspan></text><rect class="box" x="490" y="280" width="520" height="88" rx="3"/><text class="" text-anchor="middle"><tspan x="750" y="330">303 从 E0 未使用的 ΔE 形成 E+ 观测状态 O+</tspan></text><rect class="box" x="440" y="410" width="620" height="88" rx="3"/><text class="" text-anchor="middle"><tspan x="750" y="460">304 比较 O0/O+ 并绑定 ΔE 时空模态见证</tspan></text><polygon class="box" points="750,547.5 1110,615 750,682.5 390,615"/><text class="" text-anchor="middle"><tspan x="750" y="609">305 是否存在由 ΔE 引起的</tspan><tspan x="750" y="633">实质事实差分？</tspan></text><rect class="box" x="75" y="730" width="390" height="92" rx="3"/><text class="" text-anchor="middle"><tspan x="270" y="770">306 不产生写入许可</tspan><tspan x="270" y="794">继续取证或保持安全状态</tspan></text><polygon class="box" points="1000,710 1305,775 1000,840 695,775"/><text class="" text-anchor="middle"><tspan x="1000" y="769">307 同一事实槽与上下文中</tspan><tspan x="1000" y="793">是否存在竞争事实？</tspan></text><rect class="box" x="745" y="920" width="360" height="88" rx="3"/><text class="" text-anchor="middle"><tspan x="925" y="958">308 标记竞争歧义</tspan><tspan x="925" y="982">不产生正向写入许可</tspan></text><rect class="box" x="1150" y="920" width="300" height="88" rx="3"/><text class="" text-anchor="middle"><tspan x="1300" y="970">309 生成证据差分许可记录</tspan></text><rect class="box" x="1125" y="1050" width="350" height="88" rx="3"/><text class="" text-anchor="middle"><tspan x="1300" y="1088">310 写入控制存储区</tspan><tspan x="1300" y="1112">并冻结许可摘要</tspan></text><path class="line" d="M750,118 L750,160"/><path class="line" d="M750,238 L750,280"/><path class="line" d="M750,368 L750,410"/><path class="line" d="M750,498 L750,547"/><path class="line" d="M480,655 L270,730"/><text class="small" x="398" y="679">否</text><path class="line" d="M1020,655 L1000,710"/><text class="small" x="898" y="679">是</text><path class="line" d="M850,832 L925,920"/><text class="small" x="933" y="913">是</text><path class="line" d="M1150,832 L1300,920"/><text class="small" x="1308" y="913">否</text><path class="line" d="M1300,1008 L1300,1050"/><text class="" text-anchor="middle"><tspan x="130" y="965">311 冻结及联合读取时序</tspan></text><path class="plain" d="M120,1085 L890,1085"/><path class="plain" d="M210,1068 L210,1102"/><text class="small" text-anchor="middle"><tspan x="210" y="1035">t_p</tspan><tspan x="210" y="1057">许可冻结</tspan></text><path class="plain" d="M415,1068 L415,1102"/><text class="small" text-anchor="middle"><tspan x="415" y="1035">t_s</tspan><tspan x="415" y="1057">启动 A2</tspan></text><path class="plain" d="M620,1068 L620,1102"/><text class="small" text-anchor="middle"><tspan x="620" y="1035">t_a</tspan><tspan x="620" y="1057">A2 冻结</tspan></text><path class="plain" d="M825,1068 L825,1102"/><text class="small" text-anchor="middle"><tspan x="825" y="1035">t_j</tspan><tspan x="825" y="1057">联合读取</tspan></text><text class="small" text-anchor="middle"><tspan x="510" y="1150">312  时序条件：t_p &lt; t_s &lt; t_a &lt; t_j</tspan></text></svg>