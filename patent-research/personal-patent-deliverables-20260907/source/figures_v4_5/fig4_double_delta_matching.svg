  <rect width="1600" height="1050" fill="#fff"/><rect class="dash" x="50" y="55" width="630" height="500" rx="8"/><text class="" text-anchor="middle"><tspan x="365" y="93">证据许可通道</tspan></text><rect class="dash" x="920" y="55" width="630" height="500" rx="8"/><text class="" text-anchor="middle"><tspan x="1235" y="93">答案事实通道</tspan></text><rect class="box" x="105" y="145" width="235" height="88" rx="3"/><text class="" text-anchor="middle"><tspan x="222.5" y="183">401 E0 下观测</tspan><tspan x="222.5" y="207">状态 O0</tspan></text><rect class="box" x="390" y="145" width="235" height="88" rx="3"/><text class="" text-anchor="middle"><tspan x="507.5" y="183">402 E+ 下观测</tspan><tspan x="507.5" y="207">状态 O+</tspan></text><rect class="box" x="185" y="305" width="360" height="92" rx="3"/><text class="" text-anchor="middle"><tspan x="365" y="357">403 证据事实差分 ΔObs</tspan></text><rect class="box" x="135" y="450" width="460" height="92" rx="3"/><text class="" text-anchor="middle"><tspan x="365" y="490">404 证据差分许可 P</tspan><tspan x="365" y="514">事实槽—上下文—值—ΔE见证</tspan></text><rect class="box" x="975" y="145" width="235" height="88" rx="3"/><text class="" text-anchor="middle"><tspan x="1092.5" y="183">405 A0 在 E+ 下</tspan><tspan x="1092.5" y="207">事实集合 F0+</tspan></text><rect class="box" x="1260" y="145" width="235" height="88" rx="3"/><text class="" text-anchor="middle"><tspan x="1377.5" y="183">406 A2 在 E+ 下</tspan><tspan x="1377.5" y="207">事实集合 F2+</tspan></text><rect class="box" x="1055" y="305" width="360" height="92" rx="3"/><text class="" text-anchor="middle"><tspan x="1235" y="357">407 答案事实差分 ΔAns</tspan></text><rect class="box" x="1005" y="450" width="460" height="92" rx="3"/><text class="" text-anchor="middle"><tspan x="1235" y="490">408 实质答案事实迁移</tspan><tspan x="1235" y="514">新增—替换—撤回</tspan></text><rect class="box" x="570" y="625" width="460" height="80" rx="3"/><text class="" text-anchor="middle"><tspan x="800" y="671">409 迁移—许可逐项配准</tspan></text><rect class="box" x="220" y="770" width="340" height="80" rx="3"/><text class="" text-anchor="middle"><tspan x="390" y="816">410 事实槽及实体或事件一致</tspan></text><rect class="box" x="630" y="770" width="340" height="80" rx="3"/><text class="" text-anchor="middle"><tspan x="800" y="816">411 谓词、限定上下文和值相容</tspan></text><rect class="box" x="1040" y="770" width="340" height="80" rx="3"/><text class="" text-anchor="middle"><tspan x="1210" y="816">412 ΔE见证与E0/E+快照一致</tspan></text><polygon class="box" points="800,877.5 1110,935 800,992.5 490,935"/><text class="" text-anchor="middle"><tspan x="800" y="941">413 是否存在唯一有效配准？</tspan></text><rect class="box" x="85" y="915" width="350" height="88" rx="3"/><text class="" text-anchor="middle"><tspan x="260" y="953">414 标记迁移已授权</tspan><tspan x="260" y="977">进入闭包暂存</tspan></text><rect class="box" x="1165" y="915" width="350" height="88" rx="3"/><text class="" text-anchor="middle"><tspan x="1340" y="953">415 标记迁移未授权</tspan><tspan x="1340" y="977">禁止写入目标状态</tspan></text><path class="line" d="M222,233 L310,305"/><path class="line" d="M508,233 L420,305"/><path class="line" d="M365,397 L365,450"/><path class="line" d="M1092,233 L1180,305"/><path class="line" d="M1378,233 L1290,305"/><path class="line" d="M1235,397 L1235,450"/><path class="line" d="M365,542 L365,595 L690,625"/><path class="line" d="M1235,542 L1235,595 L910,625"/><path class="line" d="M800,705 L390,770"/><path class="line" d="M800,705 L800,770"/><path class="line" d="M800,705 L1210,770"/><path class="line" d="M390,850 L390,875 L800,875 L800,878"/><path class="line" d="M800,850 L800,878"/><path class="line" d="M1210,850 L1210,875 L800,875 L800,878"/><path class="line" d="M560,955 L435,955"/><text class="small" x="488" y="933">是</text><path class="line" d="M1040,955 L1165,955"/><text class="small" x="1088" y="933">否</text></svg>