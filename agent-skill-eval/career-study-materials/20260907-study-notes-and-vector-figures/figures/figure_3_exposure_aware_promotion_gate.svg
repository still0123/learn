   <g id="text_1">
    <text style="fill: #272727; font: 700 15px 'Arial', 'DejaVu Sans', 'Liberation Sans', sans-serif; text-anchor: start" x="21.024" y="29.006719" transform="rotate(-0 21.024 29.006719)">Exposure-aware promotion gate</text>
   </g>
   <g id="text_2">
    <text style="fill: #767676; font: 8.2px 'Arial', 'DejaVu Sans', 'Liberation Sans', sans-serif; text-anchor: start" x="21.024" y="39.634469" transform="rotate(-0 21.024 39.634469)">Observed data can select a candidate, but only independent and one-shot evidence can support a release claim.</text>
   </g>
   <g id="text_3">
    <text style="font: 700 12px 'Arial', 'DejaVu Sans', 'Liberation Sans', sans-serif; text-anchor: start" x="13.248" y="16.599375" transform="rotate(-0 13.248 16.599375)">c</text>
   </g>
   <g id="text_4">
    <text style="fill: #272727; font: 700 7.5px 'Arial', 'DejaVu Sans', 'Liberation Sans', sans-serif; text-anchor: middle" x="59.904" y="111.835941" transform="rotate(-0 59.904 111.835941)">Train / burned</text>
   </g>
   <g id="text_5">
    <text style="fill: #767676; font: 6.15px 'Arial', 'DejaVu Sans', 'Liberation Sans', sans-serif" transform="translate(38.366988 126.040565)">failure evidence</text>
    <text style="fill: #767676; font: 6.15px 'Arial', 'DejaVu Sans', 'Liberation Sans', sans-serif" transform="translate(33.068859 132.897507)">may guide proposal</text>
   </g>
   <g id="text_6">
    <text style="fill: #272727; font: 700 7.5px 'Arial', 'DejaVu Sans', 'Liberation Sans', sans-serif; text-anchor: middle" x="160.992" y="111.835941" transform="rotate(-0 160.992 111.835941)">Validation search</text>
   </g>
   <g id="text_7">
    <text style="fill: #767676; font: 6.15px 'Arial', 'DejaVu Sans', 'Liberation Sans', sans-serif" transform="translate(137.40675 126.0766)">select provisional</text>
    <text style="fill: #767676; font: 6.15px 'Arial', 'DejaVu Sans', 'Liberation Sans', sans-serif" transform="translate(151.934203 132.933542)">winner</text>
   </g>
   <g id="text_8">
    <text style="fill: #272727; font: 700 7.5px 'Arial', 'DejaVu Sans', 'Liberation Sans', sans-serif; text-anchor: middle" x="262.08" y="111.786722" transform="rotate(-0 262.08 111.786722)">Regression dev</text>
   </g>
   <g id="text_9">
    <text style="fill: #767676; font: 6.15px 'Arial', 'DejaVu Sans', 'Liberation Sans', sans-serif" transform="translate(239.691598 126.040565)">block regression</text>
    <text style="fill: #767676; font: 6.15px 'Arial', 'DejaVu Sans', 'Liberation Sans', sans-serif" transform="translate(238.834441 132.969577)">and cost blow-up</text>
   </g>
   <g id="text_10">
    <text style="fill: #272727; font: 700 7.5px 'Arial', 'DejaVu Sans', 'Liberation Sans', sans-serif; text-anchor: middle" x="363.168" y="111.835941" transform="rotate(-0 363.168 111.835941)">Confirmation</text>
   </g>
   <g id="text_11">
    <text style="fill: #767676; font: 6.15px 'Arial', 'DejaVu Sans', 'Liberation Sans', sans-serif" transform="translate(346.240605 126.0766)">independent</text>
    <text style="fill: #767676; font: 6.15px 'Arial', 'DejaVu Sans', 'Liberation Sans', sans-serif" transform="translate(349.152727 132.933542)">replication</text>
   </g>
   <g id="text_12">
    <text style="fill: #272727; font: 700 7.5px 'Arial', 'DejaVu Sans', 'Liberation Sans', sans-serif; text-anchor: middle" x="464.256" y="111.835941" transform="rotate(-0 464.256 111.835941)">Locked test</text>
   </g>
   <g id="text_13">
    <text style="fill: #767676; font: 6.15px 'Arial', 'DejaVu Sans', 'Liberation Sans', sans-serif" transform="translate(445.79543 126.0766)">one-shot final</text>
    <text style="fill: #767676; font: 6.15px 'Arial', 'DejaVu Sans', 'Liberation Sans', sans-serif" transform="translate(447.850395 132.933542)">assessment</text>
   </g>
   <g id="text_14">
    <text style="fill: #272727; font: 700 8px 'Arial', 'DejaVu Sans', 'Liberation Sans', sans-serif; text-anchor: middle" x="162.5472" y="216.8373" transform="rotate(-0 162.5472 216.8373)">Candidate proposal</text>
   </g>
   <g id="text_15">
    <text style="fill: #767676; font: 6.56px 'Arial', 'DejaVu Sans', 'Liberation Sans', sans-serif; text-anchor: middle" x="162.5472" y="229.094625" transform="rotate(-0 162.5472 229.094625)">may read train evidence only</text>
   </g>
   <g id="text_16">
    <text style="fill: #b64342; font: 7px 'Arial', 'DejaVu Sans', 'Liberation Sans', sans-serif; text-anchor: middle" x="132.48" y="171.414609" transform="rotate(-0 132.48 171.414609)">candidate</text>
   </g>
   <g id="text_17">
    <text style="fill: #272727; font: 700 8px 'Arial', 'DejaVu Sans', 'Liberation Sans', sans-serif; text-anchor: middle" x="366.7968" y="216.78855" transform="rotate(-0 366.7968 216.78855)">Promotion decision</text>
   </g>
   <g id="text_18">
    <text style="fill: #767676; font: 6.56px 'Arial', 'DejaVu Sans', 'Liberation Sans', sans-serif; text-anchor: middle" x="366.7968" y="229.094625" transform="rotate(-0 366.7968 229.094625)">quality + cost + lineage</text>
   </g>
   <g id="text_19">
    <text style="fill: #272727; font: 700 8px 'Arial', 'DejaVu Sans', 'Liberation Sans', sans-serif; text-anchor: middle" x="460.1088" y="215.01015" transform="rotate(-0 460.1088 215.01015)">Human review</text>
   </g>
   <g id="text_20">
    <text style="fill: #767676; font: 6.56px 'Arial', 'DejaVu Sans', 'Liberation Sans', sans-serif" transform="translate(434.584762 227.899989)">approve only with</text>
    <text style="fill: #767676; font: 6.56px 'Arial', 'DejaVu Sans', 'Liberation Sans', sans-serif" transform="translate(432.760775 235.290936)">complete evidence</text>
   </g>
   <g id="text_21">
    <text style="fill: #272727; font: 700 8px 'Arial', 'DejaVu Sans', 'Liberation Sans', sans-serif; text-anchor: middle" x="460.1088" y="297.15855" transform="rotate(-0 460.1088 297.15855)">Immutable v2</text>
   </g>
   <g id="text_22">
    <text style="fill: #767676; font: 6.56px 'Arial', 'DejaVu Sans', 'Liberation Sans', sans-serif; text-anchor: middle" x="460.1088" y="309.503062" transform="rotate(-0 460.1088 309.503062)">or BLOCKED</text>
   </g>
   <g id="text_23">
    <text style="font: 700 8.5px 'Arial', 'DejaVu Sans', 'Liberation Sans', sans-serif; text-anchor: start" x="26.208" y="288.45" transform="rotate(-0 26.208 288.45)">Non-negotiable invariants</text>
   </g>
   <g id="text_24">
    <text style="fill: #767676; font: 7px 'Arial', 'DejaVu Sans', 'Liberation Sans', sans-serif; text-anchor: start" x="31.392" y="303.908984" transform="rotate(-0 31.392 303.908984)">1. Data used to generate or select a candidate cannot become holdout evidence.</text>
   </g>
   <g id="text_25">
    <text style="fill: #767676; font: 7px 'Arial', 'DejaVu Sans', 'Liberation Sans', sans-serif; text-anchor: start" x="31.392" y="314.926266" transform="rotate(-0 31.392 314.926266)">2. A search winner is provisional; it is not a published Skill v2.</text>
   </g>
   <g id="text_26">
    <text style="fill: #767676; font: 7px 'Arial', 'DejaVu Sans', 'Liberation Sans', sans-serif; text-anchor: start" x="31.392" y="325.796984" transform="rotate(-0 31.392 325.796984)">3. The locked split is consumed once; its result must not drive retuning.</text>
   </g>
   <g id="text_27">
    <text style="fill: #767676; font: 7px 'Arial', 'DejaVu Sans', 'Liberation Sans', sans-serif; text-anchor: start" x="31.392" y="336.775438" transform="rotate(-0 31.392 336.775438)">4. Any LOSS, invalid evidence, or cost breach can block promotion.</text>
   </g>
  </g>
 </g>
