<text x="620.0" y="392" text-anchor="middle" class="small">分析 / 答案</text>
<path d="M400,240 C450,290 520,310 590,310" class="dash"/>
<text x="475" y="290" text-anchor="middle" class="note">证据约束知识使用</text>

</svg>
