<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="470" viewBox="0 0 1120 470">

<style>
  .title { font: 700 22px 'Arial', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #17365D; }
  .subtitle { font: 500 14px 'Arial', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #4F5B66; }
  .box { fill: #EAF3F8; stroke: #2F75B5; stroke-width: 1.6; rx: 12; }
  .box2 { fill: #FCE4D6; stroke: #C55A11; stroke-width: 1.6; rx: 12; }
  .box3 { fill: #E2F0D9; stroke: #548235; stroke-width: 1.6; rx: 12; }
  .box4 { fill: #E4DFEC; stroke: #7030A0; stroke-width: 1.6; rx: 12; }
  .box5 { fill: #FFF2CC; stroke: #BF9000; stroke-width: 1.6; rx: 12; }
  .small { font: 13px 'Arial', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #222; }
  .label { font: 700 15px 'Arial', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #222; }
  .note { font: 12px 'Arial', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #555; }
  .arrow { stroke: #555; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
  .dash { stroke: #777; stroke-width: 1.6; stroke-dasharray: 6 4; fill: none; marker-end: url(#arrowhead); }
</style>
<defs>
  <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#555" />
  </marker>
</defs>


<text x="560" y="34" text-anchor="middle" class="title">视听-文字时空响应图构建</text>
<text x="560" y="58" text-anchor="middle" class="subtitle">将 ASR 与 OCR 从被动上下文转化为主动视觉定位信号</text>
<rect x="50" y="110" width="150" height="80" class="box"/>
<text x="125.0" y="138" text-anchor="middle" class="label">关键帧视觉特征</text>
<text x="125.0" y="156" text-anchor="middle" class="label">X_t</text>
<rect x="50" y="230" width="150" height="80" class="box"/>
<text x="125.0" y="258" text-anchor="middle" class="label">空间视觉网格</text>
<text x="125.0" y="276" text-anchor="middle" class="label">H × W × d</text>
<path d="M200,150 L280,150" class="arrow"/>
<path d="M200,270 L280,270" class="arrow"/>
<rect x="280" y="80" width="180" height="80" class="box2"/>
<text x="370.0" y="108" text-anchor="middle" class="label">用户问题 q</text>
<text x="370.0" y="126" text-anchor="middle" class="label">问题—视觉响应 H_Q</text>
<rect x="280" y="190" width="180" height="100" class="box3"/>
<text x="370.0" y="218" text-anchor="middle" class="small">邻域 ASR 片段</text>
<text x="370.0" y="236" text-anchor="middle" class="small">时序窗口 Ω(t)</text>
<text x="370.0" y="254" text-anchor="middle" class="small">ASR—视觉响应 H_A</text>
<rect x="280" y="330" width="180" height="90" class="box5"/>
<text x="370.0" y="358" text-anchor="middle" class="label">OCR / Logo 线索</text>
<text x="370.0" y="376" text-anchor="middle" class="label">文字显著性响应 H_O</text>
<path d="M460,120 L560,200" class="arrow"/>
<path d="M460,240 L560,240" class="arrow"/>
<path d="M460,375 L560,280" class="arrow"/>
<rect x="560" y="180" width="180" height="120" class="box4"/>
<text x="650.0" y="208" text-anchor="middle" class="small">加权融合</text>
<text x="650.0" y="226" text-anchor="middle" class="small">H = αH_Q + βH_A + γH_O</text>
<text x="650.0" y="244" text-anchor="middle" class="small">任务类型调权</text>
<path d="M740,240 L830,240" class="arrow"/>
<rect x="830" y="170" width="210" height="140" class="box"/>
<text x="935.0" y="198" text-anchor="middle" class="small">综合响应图 H(t)</text>
<text x="935.0" y="216" text-anchor="middle" class="small">定位问题相关区域</text>
<text x="935.0" y="234" text-anchor="middle" class="small">缓解声画异步</text>
<text x="935.0" y="252" text-anchor="middle" class="small">突出字幕/Logo/价格</text>
<path d="M370,190 C370,150 515,145 595,180" class="dash"/>
<text x="500" y="150" text-anchor="middle" class="note">语音窗口：处理旁白领先/滞后</text>

</svg>
